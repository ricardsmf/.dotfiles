# tmux.conf — Catppuccin Macchiato, prefix C-a
# Plugins live in ~/.local/share/tmux/plugins (NOT in this stowed dir, to avoid
# nested git repos inside the dotfiles repo).

# ── Prefix ────────────────────────────────────────────────────────────────────
# C-a instead of C-b. Chosen for a Portuguese layout: `;` is Shift+, on PT, so
# C-; is really C-S-, (awkward, and not cleanly emitted by every terminal), and
# C-Space is already taken by macOS "select previous input source".
# C-a is a plain letter key, identical position on every layout.
# Press C-a twice to send a literal C-a through (keeps readline/fish
# beginning-of-line usable inside tmux).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Extended keys (CSI-u) ─────────────────────────────────────────────────────
# Required so modified keys (S-Enter, C-Enter, ...) reach TUIs like pi and
# claude-code instead of being flattened into plain Enter.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-kitty:extkeys'

# ── Terminal / colours ────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"

# ── General behaviour ─────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g display-time 2000
set -sg escape-time 0        # no delay for <Esc> in nvim
set -g focus-events on       # let nvim see focus gain/loss
setw -g mode-keys vi
set -g set-clipboard on

# ── Splits ────────────────────────────────────────────────────────────────────
# \ = horizontal (side by side), Enter = vertical (stacked). Both keep the cwd.
unbind '"'
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
bind Enter split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-style pane navigation / resize ────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi) ────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Plugins ───────────────────────────────────────────────────────────────────
# Keep TPM + plugins outside the stowed dotfiles dir.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless C-h/j/k/l movement between tmux panes and nvim splits. The nvim half
# is alexghergh/nvim-tmux-navigation (see nvim/lua/plugins/tmux-navigation.lua);
# keymaps.lua falls back to plain `wincmd` when it isn't loaded.
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme MUST be declared before continuum — continuum appends to status-right,
# and a theme loaded afterwards would clobber the save indicator.
# NOTE: catppuccin v2 renamed this option to @catppuccin_flavor (no "u");
# the old @catppuccin_flavour is ignored and silently falls back to mocha.
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'

# Session persistence (resurrect must come before continuum).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'
# Save automatically, but never restore on its own: auto-restore replays the
# last snapshot on server start, which resurrects whatever happened to be open
# last time (and spawns a session per entry). Restore on demand instead:
#   prefix + Ctrl-r   restore last saved environment
#   prefix + Ctrl-s   save now
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Auto-install TPM on first launch, then install declared plugins.
if "test ! -d $HOME/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm && $HOME/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Keep this last.
run "$HOME/.local/share/tmux/plugins/tpm/tpm"
