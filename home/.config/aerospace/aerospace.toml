config-version = 2

after-startup-command = []

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Hidden apps break tiling; Karabiner blocks cmd-h but not every hide path.
automatically-unhide-macos-hidden-apps = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

focus-follows-mouse.enabled = false

# 1 term · 2 web · 3 code · 4 chat · 5 notes · 6 tools
persistent-workspaces = ['1', '2', '3', '4', '5', '6']

# Notations resolve to US QWERTY *physical positions*, so on this PT ISO
# keyboard punctuation bindings land on keys whose printed labels differ.
# Bindings below stick to letters where it matters.
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical   = 8
gaps.outer.left       = 8
gaps.outer.bottom     = 8
gaps.outer.top        = 8
gaps.outer.right      = 8

# Must precede every [table] header below, or TOML folds it into that table.
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.vicinaehq.Vicinae', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = com.1password.1password', run = 'layout floating' },
    { if = 'test %{app-bundle-id} = net.kovidgoyal.kitty', run = 'move-node-to-workspace 1' },
    { if = 'test %{app-bundle-id} = net.imput.helium', run = 'move-node-to-workspace 2' },
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace 4' },
    { if = 'test %{app-bundle-id} = md.obsidian', run = 'move-node-to-workspace 5' },
    { if = 'test %{app-bundle-id} = app.yaak.desktop', run = 'move-node-to-workspace 6' },
    { if = 'test %{app-bundle-id} = dev.kdrag0n.MacVirt', run = 'move-node-to-workspace 6' },
]

[workspace-to-monitor-force-assignment]
    1 = 'secondary'   # ultrawide: term, web, code
    2 = 'secondary'
    3 = 'secondary'
    4 = 'main'        # built-in: chat, notes, tools
    5 = 'main'
    6 = 'main'

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-f       = 'fullscreen'
    alt-shift-f = 'layout floating tiling'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'

    alt-tab       = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-r       = 'mode resize'
    alt-shift-s = 'mode service'

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    enter = 'mode main'
    esc   = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
